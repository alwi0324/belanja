<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gaya.css">
    <link rel="icon" href="cart.jpg" type="image/x-icon">
    <title>Daftar Belanjaan</title>
    <meta property="og:title" content="Daftar Belanjaanku">
    <meta property="og:description" content="List barang yang mau dibeli">
    <meta property="og:image" itemprop="image" content="cart.jpg">
    <style>
        /* Tampilan Dark Mode */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }
        body.dark-mode .box {
            background-color: #1e1e1e;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        body.dark-mode input, body.dark-mode select {
            background-color: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
        }
        body.dark-mode ol li {
            background-color: #2a2a2a;
            color: #fff;
        }

        /* Layout Input Jumlah & Satuan */
        .input-group {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .qty-input {
            width: 65px;
        }
        .unit-select {
            width: 85px;
        }

        /* Tombol Dark Mode */
        .dark-mode-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* Tata Letak Item & Action Buttons */
        li.item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-text {
            flex-grow: 1;
            cursor: pointer;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }
        .btn-edit, .btn-del {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <button id="darkModeBtn" class="dark-mode-toggle" title="Toggle Dark Mode">🌙</button>

    <div class="container">
        <div class="box">
            <div style="margin-bottom: 15px;">
                <h2>Daftar Belanjaan</h2>
                <h4 id="buyed" class="hilang"></h4>
            </div>
            
            <div id="grocery">
                <input type="text" id="writeList" autocomplete="off" autofocus placeholder="Nama barang...">
                <div class="input-group">
                    <input type="number" id="writeQty" min="1" value="1" class="qty-input" placeholder="Qty">
                    <select id="writeUnit" class="unit-select">
                        <option value="pcs">pcs</option>
                        <option value="kg">kg</option>
                        <option value="gr">gr</option>
                        <option value="liter">liter</option>
                        <option value="pack">pack</option>
                        <option value="ikat">ikat</option>
                        <option value="botol">botol</option>
                    </select>
                    <button id="tambah">Tambahkan</button>
                </div>
            </div>
        </div>
        <ol id="belanja" class="hilang"></ol>
        <div id="busek"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Placeholder Interaktif
        let pholders = ['Ketik nama barang di sini...', 'Klik nama barang untuk mencoret', 'Gunakan ikon pensil untuk mengedit'];
        function showPlaceHolders() {
            let i = 0;
            writeList.placeholder = pholders[i++ % pholders.length];
            setInterval(() => {
                writeList.placeholder = pholders[i++ % pholders.length];
            }, 3000);
        }
        showPlaceHolders();
        
        // SVG Ikon
        const isiHapus = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 18 18"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg>`;
        const isiDone = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-check2" viewBox="0 0 18 18"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0"/></svg>`;
        const isiEdit = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.034z"/></svg>`;

        let jdl = document.querySelector('h2'),
            list = document.querySelector('ol'),
            darkModeBtn = document.getElementById('darkModeBtn');

        // Dark Mode Logic
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            darkModeBtn.innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
        });

        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            darkModeBtn.innerText = '☀️';
        }

        tambah.addEventListener('click', addItem);
        writeList.addEventListener('keyup', (e) => { if (e.keyCode == 13) addItem(); });

        // Pengurutan Alphabet A-Z
        function sortListAZ() {
            let items = Array.from(list.querySelectorAll('li'));
            items.sort((a, b) => {
                let textA = a.querySelector('.item-text').innerText.toLowerCase();
                let textB = b.querySelector('.item-text').innerText.toLowerCase();
                return textA.localeCompare(textB);
            });
            items.forEach(item => list.appendChild(item));
        }

        function kopas() {
            let temp = document.createElement('textarea');
            document.body.appendChild(temp);
            
            let arr = ['Daftar Belanja:\n'];
            let items = belanja.querySelectorAll('li');
            items.forEach((li, idx) => {
                let text = li.querySelector('.item-text').innerText;
                if (!li.classList.contains('done')) {
                    arr.push(`${idx+1}. ${text}`);
                } else {
                    arr.push(`${idx+1}. ~${text}~ ✅`);
                }
            });
            
            temp.value = arr.join('\n');
            temp.select();
            document.execCommand("copy");
            temp.remove();
            notif("Daftar Belanja Telah Disalin!", "", "success");
        }

        function muncul() {
            buyed.classList.remove('hilang');
            belanja.classList.remove('hilang');
        }
        function sembunyi() {
            buyed.classList.add('hilang');
            belanja.classList.add('hilang');
        }
        
        function notif(judul, teks, ikon) {
            swal.fire({
                title: judul,
                text: teks,
                icon: ikon,
                timer: 3000,
                showConfirmButton: false
            });
        }

        function hapus() {
            Swal.fire({
              title: "Apakah Anda Yakin?",
              text: "Seluruh daftar belanja akan dibersihkan",
              icon: "warning",
              showCancelButton: true,
              confirmButtonColor: "#d33",
              cancelButtonColor: "#3085d6",
              confirmButtonText: "Ya, bersihkan",
              cancelButtonText: "Batal"
            }).then((result) => {
              if (result.isConfirmed) {
                jdl.innerText = 'Daftar Belanjaan';
                sembunyi();
                busek.style.display = 'none';
                belanja.innerHTML = '';
                saveBelanja();
                notif("Berhasil!", "Daftar Belanja Telah Dibersihkan", "success");
              }
            });
        }

        function tambahBelanja(barang, qty = "1", unit = "pcs") {
            let item = document.createElement('li');
            item.classList.add('item');
            
            let textSpan = document.createElement('span');
            textSpan.classList.add('item-text');
            textSpan.innerText = `${barang[0].toUpperCase()}${barang.slice(1)} (${qty} ${unit})`;
            item.appendChild(textSpan);

            // Container Tombol
            let actionContainer = document.createElement('div');
            actionContainer.classList.add('action-btns');

            // Tombol Edit
            let editBtn = document.createElement('span');
            editBtn.classList.add('btn-edit');
            editBtn.innerHTML = isiEdit;
            actionContainer.appendChild(editBtn);

            // Tombol Hapus
            let rmvBtn = document.createElement('span');
            rmvBtn.classList.add('btn-del');
            rmvBtn.innerHTML = isiHapus;
            actionContainer.appendChild(rmvBtn);

            item.appendChild(actionContainer);
            list.append(item);
        }

        function addItem() {
            let data = writeList.value.trim();
            let qty = writeQty.value || "1";
            let unit = writeUnit.value;

            if (data == '') {
                notif("Isian Tidak Boleh Kosong!", "", "error");
                return;
            }

            if (data.includes(',')) {
                let items = data.split(",");
                items.forEach(x => {
                    x = x.trim();
                    if (x) tambahBelanja(x, qty, unit);
                });
            } else {
                tambahBelanja(data, qty, unit);
            }

            sortListAZ();

            jdl.innerText = `Daftar Belanjaan (${document.querySelectorAll('li').length})`;
            buyed.innerText = `Sudah terbeli: ${list.querySelectorAll('li.done').length}`;
            muncul();
            busek.style.display = 'block';
            busek.innerHTML = `<button class="salinBtn" onclick="kopas();">Salin daftar</button><button class="hapusBtn" onclick="hapus();">Bersihkan daftar</button>`;
            
            writeList.value = "";
            writeQty.value = "1";
            saveBelanja();
        }

        // Fungsi penanganan edit item
        function triggerEdit(span) {
            let currentText = span.innerText;
            Swal.fire({
                title: 'Edit Item Belanja',
                input: 'text',
                inputValue: currentText,
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed && result.value.trim() !== '') {
                    span.innerText = result.value.trim();
                    sortListAZ();
                    saveBelanja();
                }
            });
        }
        
        // Event Delegation
        document.addEventListener('click', e => {
            // Klik Tombol Edit (Ikon Pensil)
            if (e.target.closest('.btn-edit')) {
                let li = e.target.closest('li');
                let span = li.querySelector('.item-text');
                triggerEdit(span);
                return;
            }

            // Tandai selesai (Klik Teks Barang)
            if (e.target.classList.contains('item-text')) {
                let li = e.target.closest('li');
                li.classList.toggle('done');
                buyed.innerText = `Sudah terbeli: ${list.querySelectorAll('li.done').length}`;
                
                let rmvBtn = li.querySelector('.btn-del');
                rmvBtn.innerHTML = li.classList.contains('done') ? isiDone : isiHapus;
                saveBelanja();
                return;
            }

            // Hapus item (Ikon Silang)
            if (e.target.closest('.btn-del')) {
                let li = e.target.closest('li');
                li.remove();
                
                jdl.innerText = document.querySelectorAll('li').length ? `Daftar Belanjaan (${document.querySelectorAll('li').length})` : 'Daftar Belanjaan';
                buyed.innerText = `Sudah terbeli: ${list.querySelectorAll('li.done').length}`;

                if (!list.querySelectorAll('li').length) {
                    sembunyi();
                    busek.style.display = 'none';
                }
                saveBelanja();
            }
        });

        function saveBelanja() {
            localStorage.setItem('belanjaan', belanja.innerHTML);
            localStorage.setItem('terbeli', list.querySelectorAll('li.done').length);
        }

        function loadBelanja() {
            if (localStorage.getItem('terbeli') == null || localStorage.getItem('terbeli') == '0') {
                buyed.classList.add('hilang');
            } else {
                buyed.classList.remove('hilang');
                buyed.innerText = `Sudah terbeli: ${localStorage.getItem('terbeli')}`;
            }
            
            if (!localStorage.getItem('belanjaan')) {
                jdl.innerText = 'Daftar Belanjaan';
                belanja.classList.add('hilang');
                busek.style.display = 'none';
            } else {
                belanja.innerHTML = localStorage.getItem('belanjaan');
                if (list.querySelectorAll('li').length > 0) {
                    jdl.innerText = `Daftar Belanjaan (${document.querySelectorAll('li').length})`;
                    muncul();
                    busek.style.display = 'block';
                    busek.innerHTML = `<button class="salinBtn" onclick="kopas();">Salin daftar</button><button class="hapusBtn" onclick="hapus();">Bersihkan daftar</button>`;
                } else {
                    jdl.innerText = 'Daftar Belanjaan';
                    sembunyi();
                    busek.style.display = 'none';
                }
            }
        }

        loadBelanja();
    </script>
</body>
</html>
