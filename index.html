<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Belanjaan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="icon" href="cart.jpg" type="image/x-icon">
</head>
<body class="bg-gradient-to-br from-purple-600 to-cyan-400 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Toggle Dark Mode -->
    <button id="darkModeBtn" class="fixed top-5 right-5 bg-white/20 backdrop-blur-md p-3 rounded-full text-2xl shadow-lg hover:scale-110 transition-transform cursor-pointer">🌙</button>

    <div class="w-full max-w-lg flex flex-col gap-5">
        <!-- Box Input Utama -->
        <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-2xl transition-colors duration-300">
            <div class="text-center mb-4">
                <h2 id="judul" class="text-2xl font-bold text-gray-800 dark:text-gray-100">Daftar Belanjaan</h2>
                <h4 id="buyed" class="text-sm font-medium text-gray-500 dark:text-gray-400 hidden mt-1"></h4>
            </div>
            
            <div class="flex flex-col gap-2">
                <div class="flex gap-2">
                    <input type="text" id="writeList" autocomplete="off" autofocus placeholder="Nama barang..." 
                        class="w-full p-2.5 border border-gray-300 dark:border-zinc-700 rounded-xl bg-gray-50 dark:bg-zinc-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    
                    <!-- Tombol Mikrofon Voice Input -->
                    <button id="micBtn" type="button" onclick="toggleDengar()" title="Tambah via Suara"
                        class="bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-2.5 rounded-xl transition-all cursor-pointer flex items-center justify-center font-bold active:scale-95 shadow-md">
                        🎤
                    </button>
                </div>
                
                <div class="flex gap-2">
                    <input type="number" id="writeQty" min="1" value="1" placeholder="Qty" 
                        class="w-20 p-2 border border-gray-300 dark:border-zinc-700 rounded-xl bg-gray-50 dark:bg-zinc-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    
                    <select id="writeUnit" 
                        class="p-2 border border-gray-300 dark:border-zinc-700 rounded-xl bg-gray-50 dark:bg-zinc-800 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-purple-500 cursor-pointer">
                        <option value="pcs">pcs</option>
                        <option value="bungkus">bungkus</option>
                        <option value="pack">pack</option>
                        <option value="dus">dus</option>
                        <option value="buah">buah</option>
                        <option value="biji">biji</option>
                        <option value="butir">butir</option>
                        <option value="botol">botol</option>
                    </select>

                    <button id="tambah" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl py-2 transition-all cursor-pointer active:scale-95 shadow-md">Tambahkan</button>
                </div>
            </div>
        </div>

        <!-- List Belanjaan -->
        <ol id="belanja" class="list-decimal list-inside bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl p-4 max-h-80 overflow-y-auto space-y-2 hidden transition-colors duration-300"></ol>

        <!-- Tombol Aksi Bawah Style Glassmorphism Ciamik -->
        <div id="busek" class="hidden grid grid-cols-2 gap-3 p-1">
            <button onclick="kopas()" 
                class="group relative flex items-center justify-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-cyan-500/30 transition-all duration-300 cursor-pointer active:scale-95 border border-white/20">
                <svg class="w-5 h-5 transition-transform group-hover:-translate-y-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span>Salin Daftar</span>
            </button>

            <button onclick="hapus()" 
                class="group relative flex items-center justify-center gap-2 bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-400 hover:to-red-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-rose-500/30 transition-all duration-300 cursor-pointer active:scale-95 border border-white/20">
                <svg class="w-5 h-5 transition-transform group-hover:rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                <span>Bersihkan</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const optionUnits = ['pcs', 'bungkus', 'pack', 'dus', 'buah', 'biji', 'butir', 'botol'];

        // Placeholder Interaktif yang Mengedukasi Seluruh Perintah Suara
        const pholders = [
            'Ketik nama barang...',
            '🗣️ Ucapkan "2 telur" untuk menambah',
            '🗣️ Ucapkan "hapus [nama]" untuk membuang',
            '🗣️ Ucapkan "kurangi [nama]" untuk mengurangi',
            '🗣️ Ucapkan "salin daftar" untuk menyalin',
            '🗣️ Ucapkan "bersihkan" untuk menghapus semua',
            '🗣️ Ucapkan "stop" / "sudah" untuk mengakhiri'
        ];
        let phIdx = 0;
        setInterval(() => {
            writeList.placeholder = pholders[phIdx++ % pholders.length];
        }, 3000);

        // SVG Icons
        const iconHapus = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/></svg>`;
        const iconDone = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0"/></svg>`;
        const iconEdit = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.034z"/></svg>`;

        const jdl = document.getElementById('judul');
        const buyed = document.getElementById('buyed');
        const list = document.getElementById('belanja');
        const busek = document.getElementById('busek');
        const darkModeBtn = document.getElementById('darkModeBtn');

        // Status Dialog Konfirmasi Hapus Suara
        let swalKonfirmasiHapus = false;

        function capitalize(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Dark Mode Logic
        function setDarkMode(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                darkModeBtn.innerText = '☀️';
                localStorage.setItem('darkMode', 'enabled');
            } else {
                document.documentElement.classList.remove('dark');
                darkModeBtn.innerText = '🌙';
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        darkModeBtn.addEventListener('click', () => {
            const isDark = !document.documentElement.classList.contains('dark');
            setDarkMode(isDark);
        });

        if (localStorage.getItem('darkMode') === 'enabled') setDarkMode(true);

        tambah.addEventListener('click', addItem);
        writeList.addEventListener('keyup', (e) => { if (e.key === 'Enter') addItem(); });

        function sortListAZ() {
            const items = Array.from(list.querySelectorAll('li'));
            items.sort((a, b) => {
                const nameA = a.dataset.nama.toLowerCase();
                const nameB = b.dataset.nama.toLowerCase();
                return nameA.localeCompare(nameB);
            });
            items.forEach(item => list.appendChild(item));
        }

        function renderItemContent(li, nama, qty, unit) {
            nama = capitalize(nama);
            li.dataset.nama = nama;
            li.dataset.qty = qty;
            li.dataset.unit = unit;

            let textSpan = li.querySelector('.item-text');
            if (!textSpan) {
                textSpan = document.createElement('span');
                textSpan.className = "item-text flex-1 cursor-pointer select-none font-medium text-lg ml-1";
                li.appendChild(textSpan);
            }
            textSpan.innerText = `${nama} (${qty} ${unit})`;

            let btnGroup = li.querySelector('.btn-group');
            if (!btnGroup) {
                btnGroup = document.createElement('div');
                btnGroup.className = "btn-group flex items-center gap-2 ml-3 inline-flex";

                const editBtn = document.createElement('button');
                editBtn.className = "btn-edit p-2 rounded-full bg-amber-500 hover:bg-amber-600 text-white transition-colors cursor-pointer";
                editBtn.innerHTML = iconEdit;

                const delBtn = document.createElement('button');
                delBtn.className = "btn-del p-2 rounded-full bg-rose-500 hover:bg-rose-600 text-white transition-colors cursor-pointer";
                delBtn.innerHTML = iconHapus;

                btnGroup.appendChild(editBtn);
                btnGroup.appendChild(delBtn);
                li.appendChild(btnGroup);
            }
        }

        function tambahBelanja(barang, qty = "1", unit = "pcs") {
            const namaClean = capitalize(barang.trim());
            const qtyInt = parseInt(qty, 10) || 1;

            const existingLi = Array.from(list.querySelectorAll('li')).find(
                li => li.dataset.nama.toLowerCase() === namaClean.toLowerCase()
            );

            if (existingLi) {
                const currentQty = parseInt(existingLi.dataset.qty, 10) || 0;
                const newQty = currentQty + qtyInt;
                renderItemContent(existingLi, existingLi.dataset.nama, newQty.toString(), unit);
            } else {
                const li = document.createElement('li');
                li.className = "item flex items-center justify-between p-3 rounded-xl bg-gray-100 dark:bg-zinc-800 text-gray-800 dark:text-gray-100 transition-all border border-gray-200 dark:border-zinc-700 marker:font-bold marker:text-purple-500";
                renderItemContent(li, namaClean, qtyInt.toString(), unit);
                list.appendChild(li);
            }
        }

        function addItem() {
            const data = writeList.value.trim();
            const qty = writeQty.value || "1";
            const unit = writeUnit.value;

            if (!data) {
                notif("Isian Tidak Boleh Kosong!", "", "error");
                return;
            }

            if (data.includes(',')) {
                data.split(",").forEach(x => {
                    const clean = x.trim();
                    if (clean) tambahBelanja(clean, qty, unit);
                });
            } else {
                tambahBelanja(data, qty, unit);
            }

            sortListAZ();
            updateTampilan();
            writeList.value = "";
            writeQty.value = "1";
            saveBelanja();
        }

        function updateTampilan() {
            const total = list.querySelectorAll('li').length;
            const done = list.querySelectorAll('li.done').length;

            if (total > 0) {
                jdl.innerText = `Daftar Belanjaan (${total})`;
                buyed.innerText = `Sudah terbeli: ${done}`;
                buyed.classList.remove('hidden');
                list.classList.remove('hidden');
                busek.classList.remove('hidden');
            } else {
                jdl.innerText = 'Daftar Belanjaan';
                buyed.classList.add('hidden');
                list.classList.add('hidden');
                busek.classList.add('hidden');
            }
        }

        // --- Speech Recognition ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        function toggleDengar() {
            if (!SpeechRecognition) {
                notif("Tidak Didukung", "Browser Anda belum mendukung fitur pengenal suara.", "warning");
                return;
            }

            if (isListening) {
                stopDengar(true);
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = true;
            recognition.interimResults = false;

            const micBtn = document.getElementById('micBtn');
            micBtn.classList.add('animate-pulse', '!bg-rose-600');
            micBtn.innerText = '⏹️';
            isListening = true;

            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        const transcript = event.results[i][0].transcript.trim().toLowerCase();
                        
                        // Cek Perintah Berhenti
                        if (/\b(stop|sudah|cukup|selesai|matikan)\b/i.test(transcript)) {
                            stopDengar(false);
                            return;
                        }

                        if (transcript) {
                            prosesFraseSuara(transcript);
                        }
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    stopDengar(true);
                    notif("Terjadi Kesalahan", "Gagal merekam suara: " + event.error, "error");
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        stopDengar(true);
                    }
                }
            };

            recognition.start();
            notif("Mikrofon Aktif", "Bicara sekarang... (Ucapkan 'STOP' atau 'SUDAH' jika selesai)", "info");
        }

        function stopDengar(isManualClick = true) {
            isListening = false;
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('animate-pulse', '!bg-rose-600');
            micBtn.innerText = '🎤';

            if (!isManualClick) {
                const totalItem = list.querySelectorAll('li').length;
                Swal.fire({
                    title: "Perekaman Selesai! 🛑",
                    html: `<p class="text-base text-gray-600 dark:text-gray-300">Mikrofon telah dimatikan.</p>
                           <p class="text-lg font-bold text-purple-600 dark:text-purple-400 mt-2">Total barang di daftar saat ini: <span class="text-2xl">${totalItem}</span> barang</p>`,
                    icon: "success",
                    confirmButtonColor: "#9333ea"
                });
            }
        }

        function prosesFraseSuara(teks) {
            const cleanInput = teks.toLowerCase().trim();

            // 1. RESPON KONFIRMASI SUARA (Dialog Bersihkan Terbuka)
            if (swalKonfirmasiHapus) {
                if (/\b(ya|iya|lanjut|bersihkan|ok|oke)\b/i.test(cleanInput)) {
                    Swal.close();
                    swalKonfirmasiHapus = false;

                    list.innerHTML = '';
                    updateTampilan();
                    saveBelanja();

                    notif("Berhasil!", "Seluruh daftar belanja telah dibersihkan via suara.", "success");
                    return;
                } else if (/\b(batal|tidak|gak|enggak|jangan)\b/i.test(cleanInput)) {
                    Swal.close();
                    swalKonfirmasiHapus = false;
                    notif("Dibatalkan", "Pembersihan daftar dibatalkan.", "info");
                    return;
                }
            }

            // 2. PERINTAH: SALIN DAFTAR
            if (/\b(salin|salin daftar|kopas)\b/i.test(cleanInput)) {
                if (list.querySelectorAll('li').length === 0) {
                    notif("Daftar Kosong", "Tidak ada barang yang bisa disalin.", "warning");
                    return;
                }
                kopas();
                return;
            }

            // 3. PERINTAH: BERSIHKAN / DELETE ALL
            if (/\b(bersihkan|delete|hapus semua|hapus daftar)\b/i.test(cleanInput)) {
                if (list.querySelectorAll('li').length === 0) {
                    notif("Daftar Kosong", "Daftar belanjaan sudah kosong.", "info");
                    return;
                }

                swalKonfirmasiHapus = true;

                Swal.fire({
                    title: "Apakah Anda Yakin?",
                    text: "Ucapkan 'Ya' / 'Bersihkan' untuk menghapus seluruh daftar, atau 'Batal'.",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonColor: "#e11d48",
                    confirmButtonText: "Ya, bersihkan",
                    cancelButtonText: "Batal",
                    willClose: () => {
                        swalKonfirmasiHapus = false;
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        list.innerHTML = '';
                        updateTampilan();
                        saveBelanja();
                        notif("Berhasil!", "Daftar Belanja Telah Dibersihkan", "success");
                    }
                });
                return;
            }

            // 4. PERINTAH: HAPUS BARANG SATUAN (Misal: "hapus hasil")
            if (cleanInput.startsWith('hapus ')) {
                const namaTarget = cleanInput.replace(/^hapus\s+/, '').trim();
                const targetLi = Array.from(list.querySelectorAll('li')).find(
                    li => li.dataset.nama.toLowerCase() === namaTarget
                );

                if (targetLi) {
                    targetLi.remove();
                    sortListAZ();
                    updateTampilan();
                    saveBelanja();
                    notif("Berhasil Dihapus", `Barang "${capitalize(namaTarget)}" telah dihapus.`, "success");
                } else {
                    notif("Tidak Ditemukan", `Barang "${namaTarget}" tidak ada di daftar.`, "warning");
                }
                return;
            }

            // 5. PERINTAH: KURANGI BARANG (Misal: "kurangi garam" atau "kurangi 2 garam")
            if (cleanInput.startsWith('kurangi ')) {
                let sisaTeks = cleanInput.replace(/^kurangi\s+/, '').trim();
                let qtyKurang = 1;
                const matchQty = sisaTeks.match(/^(\d+)\s+(.+)/);

                if (matchQty) {
                    qtyKurang = parseInt(matchQty[1], 10);
                    sisaTeks = matchQty[2].trim();
                }

                const namaTarget = sisaTeks;
                const targetLi = Array.from(list.querySelectorAll('li')).find(
                    li => li.dataset.nama.toLowerCase() === namaTarget
                );

                if (targetLi) {
                    const currQty = parseInt(targetLi.dataset.qty, 10) || 1;
                    const newQty = currQty - qtyKurang;

                    if (newQty <= 0) {
                        targetLi.remove();
                        notif("Barang Dihapus", `Kuantitas "${capitalize(namaTarget)}" habis dan telah dihapus.`, "info");
                    } else {
                        renderItemContent(targetLi, targetLi.dataset.nama, newQty.toString(), targetLi.dataset.unit);
                        notif("Berhasil Dikurangi", `Kuantitas "${capitalize(namaTarget)}" berkurang jadi ${newQty}.`, "success");
                    }

                    sortListAZ();
                    updateTampilan();
                    saveBelanja();
                } else {
                    notif("Tidak Ditemukan", `Barang "${namaTarget}" tidak ditemukan di daftar.`, "warning");
                }
                return;
            }

            // 6. LOGIKA PENAMBAHAN BARANG
            const unitMap = {
                'pcs': 'pcs', 'pisis': 'pcs', 'buah': 'buah', 'biji': 'biji', 
                'bungkus': 'bungkus', 'brambang': 'bungkus',
                'pack': 'pack', 'pak': 'pack', 'peck': 'pack',
                'dus': 'dus', 'dos': 'dus', 'karton': 'dus',
                'butir': 'butir', 'telur': 'butir',
                'botol': 'botol'
            };

            let cleanTeks = teks
                .toLowerCase()
                .replace(/\b(dan|terus|lalu|sama)\b/gi, ',')
                .replace(/(\d+)\s+([a-zA-Z])/g, '$1, $2');

            const itemsRaw = cleanTeks.split(',');

            itemsRaw.forEach(itemStr => {
                const words = itemStr.trim().split(/\s+/);
                if (words.length === 0 || words[0] === '') return;

                let detectedQty = "1";
                let detectedUnit = "pcs";
                let namaBarangArr = [];

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const cleanWord = word.toLowerCase();

                    if (unitMap[cleanWord]) {
                        detectedUnit = unitMap[cleanWord];
                        continue;
                    }

                    if (/^\d+$/.test(cleanWord)) {
                        detectedQty = cleanWord;
                        continue;
                    }

                    namaBarangArr.push(word);
                }

                const namaFinal = namaBarangArr.join(' ').trim();

                if (namaFinal) {
                    tambahBelanja(namaFinal, detectedQty, detectedUnit);
                }
            });

            sortListAZ();
            updateTampilan();
            saveBelanja();
        }

        // Event Delegation (Click Items)
        document.addEventListener('click', (e) => {
            // Edit Item
            if (e.target.closest('.btn-edit')) {
                const li = e.target.closest('li');
                const currNama = li.dataset.nama;
                const currQty = li.dataset.qty;
                const currUnit = li.dataset.unit;

                const optionsHtml = optionUnits.map(u => `<option value="${u}" ${u === currUnit ? 'selected' : ''}>${u}</option>`).join('');

                Swal.fire({
                    title: 'Edit Item',
                    html: `
                        <div class="flex flex-col gap-3 text-left">
                            <div>
                                <label class="text-xs font-semibold text-gray-500">Nama Barang</label>
                                <input id="swal-nama" class="swal2-input !m-0 !w-full" value="${currNama}">
                            </div>
                            <div class="flex gap-2">
                                <div class="w-1/2">
                                    <label class="text-xs font-semibold text-gray-500">Qty</label>
                                    <input id="swal-qty" type="number" min="1" class="swal2-input !m-0 !w-full" value="${currQty}">
                                </div>
                                <div class="w-1/2">
                                    <label class="text-xs font-semibold text-gray-500">Satuan</label>
                                    <select id="swal-unit" class="swal2-select !m-0 !w-full !h-[48px] !mt-1">${optionsHtml}</select>
                                </div>
                            </div>
                        </div>
                    `,
                    showCancelButton: true,
                    confirmButtonText: 'Simpan',
                    cancelButtonText: 'Batal',
                    preConfirm: () => {
                        const nama = document.getElementById('swal-nama').value.trim();
                        const qty = document.getElementById('swal-qty').value || "1";
                        const unit = document.getElementById('swal-unit').value;

                        if (!nama) {
                            Swal.showValidationMessage('Nama barang tidak boleh kosong');
                            return false;
                        }
                        return { nama, qty, unit };
                    }
                }).then((res) => {
                    if (res.isConfirmed) {
                        renderItemContent(li, res.value.nama, res.value.qty, res.value.unit);
                        sortListAZ();
                        saveBelanja();
                    }
                });
                return;
            }

            // Coret Item Done
            if (e.target.classList.contains('item-text')) {
                const li = e.target.closest('li');
                li.classList.toggle('done');
                
                const span = li.querySelector('.item-text');
                const delBtn = li.querySelector('.btn-del');

                if (li.classList.contains('done')) {
                    span.classList.add('line-through', 'opacity-40');
                    delBtn.className = "btn-del p-2 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white transition-colors cursor-pointer";
                    delBtn.innerHTML = iconDone;
                } else {
                    span.classList.remove('line-through', 'opacity-40');
                    delBtn.className = "btn-del p-2 rounded-full bg-rose-500 hover:bg-rose-600 text-white transition-colors cursor-pointer";
                    delBtn.innerHTML = iconHapus;
                }

                updateTampilan();
                saveBelanja();
                return;
            }

            // Hapus Item
            if (e.target.closest('.btn-del')) {
                e.target.closest('li').remove();
                updateTampilan();
                saveBelanja();
            }
        });

        function kopas() {
            const arr = ['Daftar Belanja:\n'];
            list.querySelectorAll('li').forEach((li, idx) => {
                const txt = li.querySelector('.item-text').innerText;
                arr.push(li.classList.contains('done') ? `${idx+1}. ~${txt}~ ✅` : `${idx+1}. ${txt}`);
            });
            navigator.clipboard.writeText(arr.join('\n'));
            notif("Daftar Belanja Telah Disalin!", "", "success");
        }

        function hapus() {
            Swal.fire({
                title: "Apakah Anda Yakin?",
                text: "Seluruh daftar belanja akan dibersihkan",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#e11d48",
                confirmButtonText: "Ya, bersihkan",
                cancelButtonText: "Batal"
            }).then((result) => {
                if (result.isConfirmed) {
                    list.innerHTML = '';
                    updateTampilan();
                    saveBelanja();
                    notif("Berhasil!", "Daftar Belanja Telah Dibersihkan", "success");
                }
            });
        }

        function notif(judul, teks, ikon) {
            Swal.fire({ title: judul, text: teks, icon: ikon, timer: 2000, showConfirmButton: false });
        }

        function saveBelanja() {
            localStorage.setItem('belanjaan_html', list.innerHTML);
        }

        function loadBelanja() {
            const saved = localStorage.getItem('belanjaan_html');
            if (saved) {
                list.innerHTML = saved;
                updateTampilan();
            }
        }

        loadBelanja();
    </script>
</body>
</html>
